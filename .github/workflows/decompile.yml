name: Decompile TrollInstallerX (Full)

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORK: /home/runner/work/ipa-decompile/ipa-decompile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Install Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip
          unzip -q ghidra_11.2.1_PUBLIC_20241105.zip
          echo "GHIDRA_HOME=$WORK/ghidra_11.2.1_PUBLIC" >> $GITHUB_ENV

      - name: Prepare binaries
        run: |
          mkdir -p "$WORK/binaries"
          unzip -o "original.ipa" -d /tmp/orig
          cp "/tmp/orig/Payload/TrollInstallerX.app/TrollInstallerX" "$WORK/binaries/TrollInstallerX_original"
          unzip -o "modified.ipa" -d /tmp/mod
          cp "/tmp/mod/Payload/TrollInstallerX.app/TrollInstallerX" "$WORK/binaries/TrollInstallerX_modified"
          file "$WORK/binaries"/*

      - name: Decompile Original Binary
        run: |
          mkdir -p /tmp/ghidra_proj "$WORK/output/original"
          echo "=== Starting original binary decompilation ==="
          cd "$WORK"
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/ghidra_proj original \
            -import "$WORK/binaries/TrollInstallerX_original" \
            -postScript decompile_all.java "$WORK/output/original" \
            -scriptPath "$WORK" \
            -processor "AARCH64:LE:64:v8A" \
            -max-cpu 4
          echo "=== Listing output ==="
          ls -la "$WORK/output/original/" || echo "NO FILES"

      - name: Decompile Modified Binary
        run: |
          mkdir -p /tmp/ghidra_proj2 "$WORK/output/modified"
          echo "=== Starting modified binary decompilation ==="
          cd "$WORK"
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/ghidra_proj2 modified \
            -import "$WORK/binaries/TrollInstallerX_modified" \
            -postScript decompile_all.java "$WORK/output/modified" \
            -scriptPath "$WORK" \
            -processor "AARCH64:LE:64:v8A" \
            -max-cpu 4
          echo "=== Listing output ==="
          ls -la "$WORK/output/modified/" || echo "NO FILES"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: trollinstallerx-full-decompile
          path: ${{ env.WORK }}/output/
          retention-days: 7
          if-no-files-found: error
