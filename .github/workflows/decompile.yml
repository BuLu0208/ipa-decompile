name: Decompile TrollInstallerX (Full)

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq retdec-decompiler 2>/dev/null || true
          which retdec-decompiler && echo "retdec OK" || echo "retdec not available, will use objdump"

      - name: Prepare binaries
        run: |
          mkdir -p binaries
          unzip -o "original.ipa" -d /tmp/orig
          cp "/tmp/orig/Payload/TrollInstallerX.app/TrollInstallerX" "binaries/TrollInstallerX_original"
          unzip -o "modified.ipa" -d /tmp/mod
          cp "/tmp/mod/Payload/TrollInstallerX.app/TrollInstallerX" "binaries/TrollInstallerX_modified"

      - name: Setup Ghidra (latest)
        run: |
          sudo apt-get install -y -qq default-jdk
          java -version 2>&1
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250311.zip
          unzip -q ghidra_11.3.2_PUBLIC_20250311.zip
          echo "GHIDRA_HOME=$PWD/ghidra_11.3.2_PUBLIC" >> $GITHUB_ENV
          GHIDRA_HOME="$PWD/ghidra_11.3.2_PUBLIC"
          sed -i '1s/^\xEF\xBB\xBF//' decompile_all.java
          cp "$GHIDRA_HOME/support/analyzeHeadless" "$GHIDRA_HOME/support/analyzeHeadless.real"
          printf '#!/bin/bash\nexport JAVA_HOME_OVERRIDE="%s"\nexport PATH="%s/bin:$PATH"\nexec "$(dirname "$0")/analyzeHeadless.real" "$@"\n' "$JAVA_HOME" "$JAVA_HOME" > "$GHIDRA_HOME/support/analyzeHeadless"
          chmod +x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "Wrapper contents:"
          cat "$GHIDRA_HOME/support/analyzeHeadless"
          echo "--- Java check ---"
          "$GHIDRA_HOME/support/analyzeHeadless" --help 2>&1 | head -3

      - name: Decompile Original
        run: |
          mkdir -p /tmp/ghidra_proj output/original
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/ghidra_proj original \
            -import "$PWD/binaries/TrollInstallerX_original" \
            -postScript decompile_all.java "$PWD/output/original" \
            -scriptPath "$PWD" \
            -processor "AARCH64:LE:64:v8A" \
            -max-cpu 4
          ls -la output/original/ || echo "EMPTY"

      - name: Decompile Modified
        run: |
          mkdir -p /tmp/ghidra_proj2 output/modified
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/ghidra_proj2 modified \
            -import "$PWD/binaries/TrollInstallerX_modified" \
            -postScript decompile_all.java "$PWD/output/modified" \
            -scriptPath "$PWD" \
            -processor "AARCH64:LE:64:v8A" \
            -max-cpu 4
          ls -la output/modified/ || echo "EMPTY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: trollinstallerx-full-decompile
          path: output/
          retention-days: 7
          if-no-files-found: error
