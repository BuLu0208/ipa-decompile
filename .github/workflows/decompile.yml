name: Decompile TrollInstallerX + libxpf

on:
  workflow_dispatch:

jobs:
  decompile-libxpf-orig:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq default-jdk
      - run: wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip && unzip -q ghidra_11.2.1_PUBLIC_20241105.zip
      - run: |
          GHIDRA_HOME="$PWD/ghidra_11.2.1_PUBLIC"
          sed -i '1s/^\xEF\xBB\xBF//' decompile_all.java
          cp "$GHIDRA_HOME/support/analyzeHeadless" "$GHIDRA_HOME/support/analyzeHeadless.real"
          printf '#!/bin/bash\nexport JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"\nexport PATH="/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH"\nunset JAVA_HOME_OVERRIDE\nexec "$(dirname "$0")/analyzeHeadless.real" "$@"\n' > "$GHIDRA_HOME/support/analyzeHeadless"
          chmod +x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> $GITHUB_ENV
      - run: ls -la libxpf-original/
      - run: |
          mkdir -p output /tmp/p3
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/p3 orig-lib -import "$PWD/libxpf-original/libxpf.dylib" -postScript decompile_all.java "$PWD/output" -scriptPath "$PWD" -processor "AARCH64:LE:64:v8A" -max-cpu 4
          cp output/libxpf.dylib_decompiled.c output/original_libxpf.c 2>/dev/null || cp output/libxpf_original_decompiled.c output/original_libxpf.c 2>/dev/null || ls output/
      - uses: actions/upload-artifact@v4
        with:
          name: decompile-original-libxpf
          path: output/original_libxpf.c
          retention-days: 7

  decompile-libxpf-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq default-jdk
      - run: wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip && unzip -q ghidra_11.2.1_PUBLIC_20241105.zip
      - run: |
          GHIDRA_HOME="$PWD/ghidra_11.2.1_PUBLIC"
          sed -i '1s/^\xEF\xBB\xBF//' decompile_all.java
          cp "$GHIDRA_HOME/support/analyzeHeadless" "$GHIDRA_HOME/support/analyzeHeadless.real"
          printf '#!/bin/bash\nexport JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"\nexport PATH="/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH"\nunset JAVA_HOME_OVERRIDE\nexec "$(dirname "$0")/analyzeHeadless.real" "$@"\n' > "$GHIDRA_HOME/support/analyzeHeadless"
          chmod +x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> $GITHUB_ENV
      - run: ls -la libxpf-modified/
      - run: |
          mkdir -p output /tmp/p4
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/p4 mod-lib -import "$PWD/libxpf-modified/libxpf.dylib" -postScript decompile_all.java "$PWD/output" -scriptPath "$PWD" -processor "AARCH64:LE:64:v8A" -max-cpu 4
          cp output/libxpf.dylib_decompiled.c output/modified_libxpf.c 2>/dev/null || cp output/libxpf_modified_decompiled.c output/modified_libxpf.c 2>/dev/null || ls output/
      - uses: actions/upload-artifact@v4
        with:
          name: decompile-modified-libxpf
          path: output/modified_libxpf.c
          retention-days: 7
