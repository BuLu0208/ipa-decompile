name: Decompile TrollInstallerX (Full)

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ghidra
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip
          unzip -q ghidra_11.2.1_PUBLIC_20241105.zip
          echo "GHIDRA_HOME=$PWD/ghidra_11.2.1_PUBLIC" >> $GITHUB_ENV
          sed -i '1s/^\xEF\xBB\xBF//' decompile_all.java
          cp "$GHIDRA_HOME/support/analyzeHeadless" "$GHIDRA_HOME/support/analyzeHeadless.real"
          printf '#!/bin/bash\nexport JAVA_HOME_OVERRIDE="${JAVA_HOME}"\nexport PATH="${JAVA_HOME}/bin:${PATH}"\nexec "$(dirname "$0")/analyzeHeadless.real" "$@"\n' > "$GHIDRA_HOME/support/analyzeHeadless"
          chmod +x "$GHIDRA_HOME/support/analyzeHeadless"

      - name: Prepare binaries
        run: |
          mkdir -p binaries
          unzip -o "original.ipa" -d /tmp/orig
          cp "/tmp/orig/Payload/TrollInstallerX.app/TrollInstallerX" "binaries/TrollInstallerX_original"
          unzip -o "modified.ipa" -d /tmp/mod
          cp "/tmp/mod/Payload/TrollInstallerX.app/TrollInstallerX" "binaries/TrollInstallerX_modified"

      - name: Decompile Original
        run: |
          mkdir -p /tmp/ghidra_proj output/original
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/ghidra_proj original \
            -import "$PWD/binaries/TrollInstallerX_original" \
            -postScript decompile_all.java "$PWD/output/original" \
            -scriptPath "$PWD" \
            -processor "AARCH64:LE:64:v8A" \
            -max-cpu 4
          ls -la output/original/ || echo "EMPTY"

      - name: Decompile Modified
        run: |
          mkdir -p /tmp/ghidra_proj2 output/modified
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/ghidra_proj2 modified \
            -import "$PWD/binaries/TrollInstallerX_modified" \
            -postScript decompile_all.java "$PWD/output/modified" \
            -scriptPath "$PWD" \
            -processor "AARCH64:LE:64:v8A" \
            -max-cpu 4
          ls -la output/modified/ || echo "EMPTY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: trollinstallerx-full-decompile
          path: output/
          retention-days: 7
          if-no-files-found: error
